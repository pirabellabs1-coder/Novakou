name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Pas de `version:` ici. La version fait foi dans package.json
        # (packageManager: pnpm@9.15.9) ; la declarer aux deux endroits fait
        # echouer action-setup@v4 avant meme l'installation des dependances.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

  e2e:
    name: E2E Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    needs: ci
    # Only on PRs and main pushes
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    # Sans base, chaque page qui interroge Prisma attendait le délai de
    # connexion À CHAQUE requête : l'accueil mettait plus de 30 s à répondre et
    # 28 tests expiraient. Les identifiants ci-dessous sont exactement ceux que
    # DATABASE_URL attendait déjà plus bas — le service, lui, manquait.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Pas de `version:` ici. La version fait foi dans package.json
        # (packageManager: pnpm@9.15.9) ; la declarer aux deux endroits fait
        # echouer action-setup@v4 avant meme l'installation des dependances.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @freelancehigh/web exec playwright install --with-deps chromium

      - name: Apply database schema
        run: pnpm --filter @freelancehigh/db migrate:deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          DIRECT_URL: postgresql://test:test@localhost:5432/test

      - name: Run E2E tests
        run: pnpm --filter @freelancehigh/web test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          DIRECT_URL: postgresql://test:test@localhost:5432/test
          NEXTAUTH_SECRET: ci-test-secret-not-for-prod
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

    # Note: Vercel handles deployment via GitHub integration.
    # CI runs lint + typecheck + build + E2E. Failures block deploy via branch protection.
