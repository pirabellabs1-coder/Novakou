# ═══════════════════════════════════════════════════════════════════════
# Novakou — Proxy à IP fixe pour les versements FeexPay
# ═══════════════════════════════════════════════════════════════════════
#
# Mission : sortir vers `api.feexpay.me` avec l'IP publique fixe du VPS,
# de sorte que FeexPay accepte nos requêtes de VERSEMENT (payout).
#
# Ce que ce fichier fait :
#   1. Écoute sur le port 3128.
#   2. Exige une authentification Basic (fichier passwd).
#   3. N'autorise le CONNECT que vers api.feexpay.me:443 — TOUS les
#      autres hôtes sont refusés. Un attaquant qui obtiendrait les
#      identifiants ne pourrait sortir NULLE PART ailleurs.
#   4. Journalise tous les accès dans /var/log/squid/access.log.
#
# ⚠️ NE PAS mettre `htaccess_realm` sensible ni info interne : le realm
# est visible sur toute erreur 407 renvoyée à un client mal configuré.

# ─── Écoute ─────────────────────────────────────────────────────────────
http_port 3128

# ─── Authentification Basic ────────────────────────────────────────────
# Fichier /etc/squid/passwd généré côté déploiement par :
#   docker compose exec proxy htpasswd -c /etc/squid/passwd novakou
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic realm Novakou payout proxy
auth_param basic credentialsttl 2 hours
acl authenticated proxy_auth REQUIRED

# ─── Whitelist stricte des destinations autorisées ──────────────────────
# Ajouter ici un domaine = donner le pouvoir de sortir vers lui. Chaque
# ajout est un risque, à justifier par un usage concret dans le code Vercel.
acl feexpay_dst dstdomain api.feexpay.me
acl feexpay_dst dstdomain .feexpay.me
acl safe_ports port 443
acl connect_method method CONNECT

# ─── Règles d'accès ────────────────────────────────────────────────────
# 1. Refuser TOUT ce qui n'est pas sur port sûr.
http_access deny !safe_ports
# 2. Refuser tout CONNECT ailleurs que sur 443 (pas de SSH-in-tunnel).
http_access deny CONNECT !safe_ports
# 3. Autoriser CONNECT vers FeexPay APRÈS authentification.
http_access allow connect_method feexpay_dst authenticated
# 4. Autoriser GET/POST HTTP vers FeexPay APRÈS authentification (au cas
#    où FeexPay expose un endpoint HTTP, ce qu'on évite en pratique).
http_access allow feexpay_dst authenticated
# 5. TOUT le reste est refusé — impossible d'utiliser ce proxy pour
#    sortir ailleurs, même avec les bons identifiants.
http_access deny all

# ─── Anonymisation ─────────────────────────────────────────────────────
# On ne veut pas révéler à FeexPay que la requête vient d'un client
# derrière un proxy Squid — Fixie ne le faisait pas non plus.
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
request_header_access Cache-Control deny all

# ─── Timeouts (généreux : versement critique) ──────────────────────────
connect_timeout 20 seconds
read_timeout 60 seconds
request_timeout 60 seconds
persistent_request_timeout 30 seconds

# ─── Cache : désactivé (chaque requête doit toucher FeexPay) ────────────
cache deny all
cache_dir null /tmp

# ─── Journalisation ────────────────────────────────────────────────────
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
logfile_rotate 7

# ─── Coordonnées de l'administrateur (affiché sur pages d'erreur) ──────
cache_mgr contact@pirabellabs.com
visible_hostname payout-proxy.novakou
